<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMINA CRM</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMINA CRM">
<link rel="manifest" href="/amina-crm/manifest.webmanifest">
<link rel="icon" href="/amina-crm/icons/icon-192.png">
<link rel="apple-touch-icon" href="/amina-crm/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/amina-crm/config.js"></script>
<style>
:root{
  --bg:#f3f4f1; --card:#ffffff; --ink:#14181f; --muted:#6b7280; --line:#e5e7e1;
  --accent:#0f172a; --accent-ink:#fff; --soft:#eceee8;
  --red:#d92d20; --red-bg:#fdecea; --amber:#b54708; --amber-bg:#fef3e2;
  --green:#067647; --green-bg:#e7f6ec; --blue:#1d4ed8; --blue-bg:#e8efff;
  --amina:#7a2e0e; --amina-bg:#fbeee6; --krovat:#1d4ed8; --krovat-bg:#e8efff; --grand:#6d28d9; --grand-bg:#f1e9ff;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0f17; --card:#141a24; --ink:#eef1f6; --muted:#98a2b3; --line:#232b38;
    --accent:#eef1f6; --accent-ink:#0b0f17; --soft:#1b2230;
    --red:#ff6b5f; --red-bg:#3a1714; --amber:#fdb022; --amber-bg:#3a2a10; --green:#47cd89; --green-bg:#0f2c1d;
    --blue:#84a9ff; --blue-bg:#16213d; --amina:#f4a27a; --amina-bg:#3a2016; --krovat:#84a9ff; --krovat-bg:#16213d; --grand:#c4a5ff; --grand-bg:#2a1d45;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;text-align:center}
.logo{width:72px;height:72px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:26px;margin:0 auto 18px;letter-spacing:-1px}
.login-card h1{margin:0 0 6px;font-size:24px;letter-spacing:-.4px}
.login-card p{margin:0 0 26px;color:var(--muted)}
#gbtn{display:flex;justify-content:center;min-height:44px}
.err{margin-top:18px;background:var(--red-bg);color:var(--red);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px}

/* Header */
header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.top .who{flex:1;min-width:0}
.top .hi{font-size:13px;color:var(--muted);font-weight:600}
.top .nm{font-size:20px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px}
.stat{background:var(--card);border-radius:14px;padding:10px 10px 9px;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;text-align:left}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.stat.blue b{color:var(--blue)} .stat.red b{color:var(--red)} .stat.amber b{color:var(--amber)} .stat.green b{color:var(--green)}
.stat.on{outline:2px solid var(--accent);outline-offset:-1px}

.tools{display:flex;gap:8px;padding-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search input{border:0;outline:0;background:transparent;width:100%;height:100%}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
select.opsel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px;max-width:42%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip i{font-style:normal;opacity:.6;margin-left:4px}

/* List */
#list{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.card.flag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.row1{display:flex;align-items:center;gap:8px}
.name{font-weight:800;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.time{font-size:12px;color:var(--muted);font-weight:600;flex:none}
.row2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--soft);color:var(--ink);white-space:nowrap}
.b-amina{background:var(--amina-bg);color:var(--amina)} .b-krovat{background:var(--krovat-bg);color:var(--krovat)} .b-grand{background:var(--grand-bg);color:var(--grand)}
.h-new{background:var(--blue-bg);color:var(--blue)} .h-warm{background:var(--amber-bg);color:var(--amber)} .h-good{background:var(--green-bg);color:var(--green)} .h-bad{background:var(--soft);color:var(--muted)}
.meta{font-size:13px;color:var(--muted);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flagpill{font-size:12px;font-weight:700;color:var(--red);background:var(--red-bg);border-radius:8px;padding:3px 8px}
.note{margin-top:8px;font-size:13.5px;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.callbtn{width:40px;height:40px;border-radius:12px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;flex:none;border:0;cursor:pointer}
.callbtn svg{width:19px;height:19px}
.empty{text-align:center;color:var(--muted);padding:48px 12px;font-weight:600}
.more{display:block;margin:6px auto 0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
@media (min-width:820px){.sheet{left:50%;right:auto;width:720px;margin-left:-360px;bottom:24px;border-radius:22px;max-height:88vh}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sh{padding:0 18px}
.sh h2{margin:4px 0 2px;font-size:21px;letter-spacing:-.4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
.kv dt{color:var(--muted);font-weight:600} .kv dd{margin:0;font-weight:700;word-break:break-word}
.calls{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.calls a{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;font-weight:800}
.calls a.alt{background:var(--green-bg);color:var(--green)}
.calls svg{width:18px;height:18px}
.lbl{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
.hgrid{display:flex;flex-wrap:wrap;gap:7px}
.hopt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:700;font-size:13.5px;cursor:pointer}
.hopt.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);resize:vertical;outline:0}
textarea:focus,input[type=date]:focus{border-color:var(--accent)}
.daterow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input[type=date]{height:42px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--bg);outline:0}
.save{position:sticky;bottom:0;background:var(--card);padding:14px 18px 4px;display:flex;gap:8px}
.btn{flex:1;height:50px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;cursor:pointer}
.btn.ghost{flex:none;width:96px;background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;opacity:0;transition:.2s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo-badge{position:fixed;right:10px;bottom:10px;background:var(--amber-bg);color:var(--amber);font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;z-index:5}
</style>
</head>
<body>

<!-- KIRISH -->
<section id="login" class="hidden">
  <div class="login-card">
    <div class="logo">AG</div>
    <h1>AMINA GROUP CRM</h1>
    <p>Ishni boshlash uchun Google akkauntingiz bilan kiring</p>
    <div id="gbtn"></div>
    <div id="loginErr" class="err hidden"></div>
  </div>
</section>

<!-- ASOSIY -->
<section id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="top">
        <div class="who"><div class="hi" id="hi">Salom</div><div class="nm" id="nm">—</div></div>
        <button class="iconbtn" id="refresh" title="Yangilash" aria-label="Yangilash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="iconbtn" id="logout" title="Chiqish" aria-label="Chiqish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Ism yoki telefon" autocomplete="off">
        </label>
        <select id="opsel" class="opsel hidden" aria-label="Operator"></select>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>
  <main class="wrap" id="list"></main>
</section>

<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="/amina-crm/app.js"></script>
</body>
</html>
